title = "CopyLane gitleaks config"

# ============================================================
# 비밀 스캔 설정 (보안점검 P0-2)
# ------------------------------------------------------------
#  🚨 gitleaks 는 .gitignore 를 보지 않는다 (upstream issue #1195).
#     제외할 경로를 여기에 다시 적어야 한다.
#
#  자동 인식: 스캔 대상 경로의 `.gitleaks.toml` 을 gitleaks 가
#            알아서 읽는다. -c 옵션 불필요.
#
#  사용법
#    gitleaks dir . --verbose                       # 작업 트리 전체
#    gitleaks git . --verbose                       # 커밋 이력 전체
#    gitleaks git . --pre-commit --staged --redact  # 커밋 직전 (훅)
#
#  🚨 D-60 공개 전환 직전에는 반드시 `gitleaks git .` 을 돌린다 —
#     지울 것은 최신 커밋이 아니라 히스토리 전체다 (D-78 ④).
# ============================================================

[extend]
useDefault = true

[[allowlists]]
description = "우리가 작성하지 않은 것 — 가상환경 · 빌드 산출물 · 모델 가중치 · 캐시"
# 🚨 paths 는 glob 이 아니라 정규식이다
paths = [
  '''(^|/)\.venv/''',
  '''(^|/)venv/''',
  '''(^|/)node_modules/''',
  '''(^|/)__pycache__/''',
  '''(^|/)\.(mypy|pytest|ruff)_cache/''',
  '''(^|/)dist/''',
  '''(^|/)models/''',
  '''(^|/)mlruns/''',
  '''(^|/)\.git/''',
]

[[allowlists]]
description = ".env.example 의 자리표시자 — 실제 값이 아니다"
paths = ['''(^|/)\.env\.example$''']

# ------------------------------------------------------------
# ⚠️ data/ 는 일부러 제외하지 않는다.
#    수집한 자료에 키가 섞여 들어오는 경우를 잡아야 하고,
#    그것이 거버넌스가 보려는 것이다 (D-15 · D-19).
#    코퍼스가 커져 스캔이 느려지면 그때 다시 판단한다.
# ------------------------------------------------------------
