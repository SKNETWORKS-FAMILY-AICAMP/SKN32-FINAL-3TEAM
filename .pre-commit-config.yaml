# ============================================================
# pre-commit hooks (security check P0-2, D-51)
#
# NOTE: keep this file ASCII-only.
#   pre-commit may read it with the system code page (cp949 on
#   Korean Windows) and non-ASCII characters break autoupdate.
#
# Install (once per developer):
#   uv run pre-commit install
#
# rev values are pinned. To bump them run:
#   uv run pre-commit autoupdate
# and commit the result. Do not hand-edit rev.
# ============================================================

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Secret scanning. Config is read from .gitleaks.toml at repo root.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Preserved artifacts are read-only archives: a hook that rewrites them
      # defeats the reason they exist (2026-09-11, D-186 / D-53).
      #   assets/brand/legacy/   earlier brand assets, cited by shipped documents
      #   ^[^\x00-\x7F]          the presentation folder (its name is Korean).
      #                          This file must stay ASCII-only -- see NOTE above --
      #                          so the path is matched as "starts with a non-ASCII
      #                          character" instead of spelled out. It is the only
      #                          top-level directory whose name is not ASCII.
      # Both were silently modified on 2026-09-11, before this exclude existed.
      - id: end-of-file-fixer
        exclude: ^(assets/brand/legacy/|[^\x00-\x7F])
      - id: trailing-whitespace
        # Two trailing spaces mean <br> in Markdown. Do not strip them.
        args: [--markdown-linebreak-ext=md]
        exclude: ^(assets/brand/legacy/|[^\x00-\x7F])
      - id: check-yaml
        # registry_head/tail are FRAGMENTS concatenated into data_sources.yaml
        # by scripts/gen_registry.py. They are not standalone documents, so
        # parsing them alone is meaningless. Their validity is proven by the
        # assembled data_sources.yaml, which this hook and the gate tests do check.
        exclude: ^scripts/registry_(head|tail)\.yaml$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
