    <text x="60" y="92" font-size="15" font-weight="700" fill="#16324F">공정위 의결서</text>
    <text x="60" y="113" font-size="12" fill="#64748B">1층 판정라벨 · ftc_decisions_body</text>
    <text x="312" y="103" font-size="19" font-weight="700" fill="#16324F" text-anchor="end">16,506</text>
  </g>
  <g>
    <rect x="40" y="140" width="292" height="62" rx="10" fill="#F6F8FA" stroke="#E2E8F0"/>
    <rect x="40" y="140" width="3.5" height="62" rx="2" fill="#0E7C7B"/>
    <text x="60" y="166" font-size="15" font-weight="700" fill="#16324F">식약처 인정 원료</text>
    <text x="60" y="187" font-size="12" fill="#64748B">2층 적법라벨 · 승인 문구의 출처</text>
    <text x="312" y="177" font-size="19" font-weight="700" fill="#16324F" text-anchor="end">1,334</text>
