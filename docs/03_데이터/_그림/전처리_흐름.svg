      <g><text x="330" y="474" font-size="22" font-weight="700" fill="#16324F">854</text>
         <text x="330" y="496" font-size="11.5" fill="#5A6B7D">1층 후보 (CORE)</text></g>
      <g><text x="532" y="474" font-size="22" font-weight="700" fill="#0B5F5E">785</text>
         <text x="532" y="496" font-size="11.5" fill="#478886">문구를 담은 문서</text></g>
      <g><text x="734" y="474" font-size="22" font-weight="700" fill="#0B5F5E">8,946</text>
         <text x="734" y="496" font-size="11.5" fill="#478886">뽑은 문구</text></g>
      <g><text x="920" y="474" font-size="22" font-weight="700" fill="#0B5F5E">5,233</text>
