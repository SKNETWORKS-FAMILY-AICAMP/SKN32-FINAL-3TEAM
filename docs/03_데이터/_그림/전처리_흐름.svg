  <g>
    <rect x="756" y="214" width="244" height="58" rx="10" fill="#F6F8FA" stroke="#E2E8F0"/>
    <text x="776" y="238" font-size="14" font-weight="700" fill="#16324F">RAG 청크</text>
    <text x="776" y="257" font-size="11.5" fill="#64748B">임베딩 2,400 / 2,400</text>
    <text x="980" y="249" font-size="19" font-weight="700" fill="#16324F" text-anchor="end">2,400</text>
  </g>
  <g>
    <rect x="756" y="282" width="244" height="58" rx="10" fill="#F6F8FA" stroke="#E2E8F0"/>
    <text x="776" y="306" font-size="14" font-weight="700" fill="#16324F">제품 사실</text>
    <text x="776" y="325" font-size="11.5" fill="#64748B">2층 적법 라벨의 재료</text>
    <text x="980" y="317" font-size="19" font-weight="700" fill="#16324F" text-anchor="end">447</text>
  </g>

