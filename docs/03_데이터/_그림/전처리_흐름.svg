  <text x="40" y="540" font-size="11.5" fill="#94A3B8">주문만 보던 시절엔 283문서 · 627문구뿐이었다. 「이유」를 회수해 502문서 · 4,932문구가 들어왔다 (D-232 · D-234).</text>
