    <g><circle cx="412" cy="252" r="9" fill="#0E7C7B"/><text x="412" y="256.5" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="700">4</text>
      <text x="434" y="249" font-weight="700">조문 라벨</text><text x="434" y="266" font-size="11.5" fill="#64748B">유형 6종 — 조문이 붙인다</text></g>
    <g><circle cx="412" cy="304" r="9" fill="#0E7C7B"/><text x="412" y="308.5" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="700">5</text>
      <text x="434" y="301" font-weight="700">분할 → 사전 → 주입 → 물질화</text><text x="434" y="318" font-size="11.5" fill="#64748B">분할이 맨 앞이다</text></g>
  </g>

