<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#0E7C7B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="fun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16324F" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0E7C7B" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <rect width="1040" height="560" fill="#FFFFFF"/>

  <!-- 밴드 머리 -->
  <g font-size="12" letter-spacing="2.4" fill="#94A3B8" font-weight="600">
