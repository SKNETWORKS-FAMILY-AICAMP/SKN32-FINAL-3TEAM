# alembic.ini - migration config (D-20, D-84-11)
#
# !! ASCII ONLY. Do not put Korean or em-dashes in this file.
#    alembic reads this with encoding="locale" (configparser), which is cp949 on
#    Korean Windows. Any UTF-8 byte above 0x7F makes `alembic upgrade` die with
#    UnicodeDecodeError before it even looks at the database. Measured 2026-09-09.
#    The explanation that used to live here is in alembic/env.py, which Python
#    always reads as UTF-8.
#
# !! Do NOT set sqlalchemy.url here. See alembic/env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Date in the filename so the order is readable by eye
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
