# alembic.ini — 마이그레이션 설정 (D-20 · D-84 ⑪)
#
# 🚨 sqlalchemy.url 을 여기 적지 않는다. .env 의 DATABASE_URL 을 alembic/env.py 가 읽는다.
#    여기 적으면 접속 문자열이 커밋되고, 그것이 gitleaks 가 막으려는 것이다.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# 파일명에 날짜를 넣어 순서를 눈으로 읽는다
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
