# ============================================================
# CopyLane — 비밀 스캔 (이력 전체)
# ------------------------------------------------------------
#  🔴 D-188 — **이것으로 갈음하지 않는다.**
#     2026-09-11 공개 전환 직전, gitleaks 가 199커밋 11.67MB 를 훑고
#     「no leaks found」를 냈다. 그런데 `.env.example` 에 LAW_OC_KEY 값이
#     있었다 — 경로가 allowlist 였고, 값이 평범한 영숫자라 어떤 규칙에도
#     안 걸렸다. 잡은 것은 `git log -p --follow` 한 줄이었다.
#     ★ 이 워크플로는 **하한선**이지 점검표가 아니다. 공개·배포 전에는
#       D-188 의 네 줄을 사람이 읽는다.
#
#  🚨 gitleaks-action 을 쓰지 않는다 — organization 계정은 GITLEAKS_LICENSE
#     를 요구한다. SKNETWORKS-FAMILY-AICAMP 는 org 다. 컨테이너로 직접 돈다.
#
#  🚨 fetch-depth: 0 — 기본값(1)이면 **이력을 안 본다.** 지운 커밋에 남은
#     키를 잡는 것이 이 워크플로의 전부인데 그러면 아무것도 안 한다.
# ============================================================

name: secrets

on:
  pull_request:
  schedule:
    # 매주 월요일 05:00 KST (일요일 20:00 UTC)
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    name: gitleaks (이력 전체)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # 🚨 allowlist 는 「검사에서 뺀 것」의 목록이다. 로그에 남겨,
      #    무탐 결과를 볼 때 무엇을 안 봤는지도 같이 보이게 한다 (D-188).
      - name: 검사에서 뺀 자리
        run: cat .gitleaks.toml

      # 버전은 .pre-commit-config.yaml 의 rev 와 맞춘다 — 로컬과 CI 가
      # 다른 판으로 돌면 「로컬은 통과하는데 CI 는 잡는다」가 난다 (D-99).
      #
      # 🔴 **태그 + 다이제스트를 둘 다 적는다** (D-215 · 2026-09-12 밤 실측).
      #    태그만 두면 `v8.30.0` 이 옮겨질 때 다른 이미지가 우리 저장소를 훑는다.
      #    ★ 그런데 **태그를 지우면** 위의 D-99 비교(`.pre-commit-config.yaml` 의 `rev`)가
      #      끊긴다 — 그래서 둘 다 적는다. **다이제스트가 뜻을 정하고, 태그는 사람이 읽는다.**
      #    🚨 박은 것은 **멀티플랫폼 인덱스**(`application/vnd.oci.image.index.v1+json`)다.
      #       플랫폼별(linux/amd64 = 105ac66a…)을 박으면 runner 아키텍처가 바뀌는 날 죽는다.
      #    🔴 판을 올릴 때 다시 재는 법 —
      #         docker buildx imagetools inspect ghcr.io/gitleaks/gitleaks:<판>
      #       맨 위 `Digest:` 줄을 쓴다 (Manifests 아래의 것이 아니다).
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git /repo --redact -v --exit-code 1
