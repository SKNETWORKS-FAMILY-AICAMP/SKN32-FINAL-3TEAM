# ============================================================
# CopyLane — 프로젝트 정의 · 의존성 · 도구 설정
# ------------------------------------------------------------
#  🚨 환경 동일성의 단일 출처는 uv.lock 이다 (D-51).
#     이 파일은 "무엇을" 쓰는지, uv.lock 은 "정확히 어느 버전"을 쓰는지 적는다.
#     uv.lock 은 반드시 커밋한다 — 5인 환경 불일치 = 최소 1주 손실 (기획서 W1 #7).
#
#  사용법
#    uv sync                 # 개발 환경 (dev 그룹 포함)
#    uv sync --no-dev        # 배포 이미지 (테스트 도구 제외 — D-78)
#    uv run pytest
#    uv run ruff check .
# ============================================================

[project]
name = "copylane"
version = "0.1.0"
description = "광고 문구 준법 검수·생성 플랫폼 (SKN Final Project)"
readme = "README.md"
# 🚨 패치 버전 고정은 .python-version 파일이 한다 (uv 가 자동으로 읽는다).
#    여기는 상한/하한 가드이고, 실제 고정값은 .python-version 이다.
requires-python = "==3.11.*"

# ------------------------------------------------------------
# 런타임 의존성 — W1 최소셋 (cli · db · 설정)
#  🚨 주차별로 필요할 때 추가한다. 지금 LangGraph·GPU 패키지까지 넣으면
#     W3 에 재 lock 이 반복되고 lock 충돌이 팀 전체로 번진다.
# ------------------------------------------------------------
dependencies = [
    "typer>=0.12",          # launcher 껍데기 (D-51)
    "rich>=13.7",           # 콘솔 메뉴·진단 출력
    "pyyaml>=6.0",          # data_sources.yaml 레지스트리 (D-15)
    "python-dotenv>=1.0",   # .env 로드 (.env 은 커밋 금지)
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2", # Windows 5인 환경 — binary 휠 필수
    "pgvector>=0.3",
    "alembic>=1.13",
    "olefile>=0.47",      # HWP 5.x 복합문서 읽기 (D-150) — 순수 파이썬
    # 🔄 2026-09-08 docs 그룹 → 런타임으로 옮겼다 (D-158).
    #    사례집 PDF 파싱이 **전처리 파이프라인의 일부**가 됐다. 문서 빌드 전용이 아니다.
    #    ⛔ docs 그룹에 둔 채 모듈을 쓰다가 `uv run` 이 ModuleNotFoundError 로 죽었다 —
    #       테스트는 전부 통과했다. 데이터 경로를 타는 코드가 `pages()` 안의 지연 import 뿐이라
    #       **테스트가 이 의존성을 한 번도 안 건드린다.** 여기서는 lock 이 유일한 대조기다.
    #    ★ docs 그룹을 나눈 이유는 playwright(브라우저 바이너리)였지 pdfplumber 가 아니다.
    "pdfplumber>=0.11",   # 사례집 PDF → 1층 판정라벨 (D-158)
    "sentence-transformers>=6.0.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "jinja2>=3.1.6",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    # 🔴 2026-09-12 밤 (D-213) — `governor` 로그인의 비밀번호 해시.
    #    OWASP Password Storage Cheat Sheet 의 **preferred** 이고, 고시 제7조가 요구하는
    #    「일방향 암호화」다 (보안점검 P1-7 — 단순 SHA-256 1회는 부적절).
    #    🚨 scrypt(표준 라이브러리)를 한때 골랐다가 뒤집었다: OWASP 는 scrypt 를
    #       *"Argon2id 를 못 쓸 때"* 로 규정하는데 **우리는 못 쓰는 게 아니고**(abi3 휠이 있다),
    #       scrypt 최소 권고는 64~128 MiB/로그인인데 Argon2id 는 19 MiB 다 — 추론과 16 GiB 를
    #       나눠 쓰는 배포에서 **무거운 쪽이 곧 공격자에게 주는 증폭기**다 (P2-11).
    #    ⛔ 전이 의존이 셋 더 붙는다 — argon2-cffi-bindings · cffi · pycparser.
    #       **팀원 코드가 0줄인 지금이 lock 을 만지는 가장 싼 순간**이라 지금 넣었다.
    "argon2-cffi>=25.1",
]

[dependency-groups]
# 🚨 dev 는 배포 이미지에 딸려가지 않는다 (uv sync --no-dev)
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

# 🚨 문서 빌드 전용 — 기본 설치에 넣지 않는다.
#    5인이 매일 쓰는 것이 아니고, playwright 는 브라우저 바이너리까지 받는다.
#    제출본이 필요할 때만:  uv sync --group docs  &&  uv run playwright install chromium
docs = [
    "markdown>=3.6",      # 마크다운 -> HTML
    "playwright>=1.45",   # HTML -> PDF 렌더
    # 🔄 pdfplumber 는 런타임 의존성으로 옮겼다 (D-158) — 여기서도 그대로 쓸 수 있다.
]

# ============================================================
# ruff — lint + format
# ============================================================
[tool.ruff]
target-version = "py311"
line-length = 100
# 🚨 docs/ 제외 — 문서 안의 예시 코드는 사람이 읽으라고 정렬한 것이다.
#    포매터가 손대면 D-54 단일 출처 문서가 의도 없이 바뀐다.
extend-exclude = ["data", "dist", "models", "mlruns", ".idea", "docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort — import 정렬
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "W605", # 잘못된 이스케이프(`"\s"`) — 🆕 2026-09-21 docstring 한 곳이 테스트 중 DeprecationWarning 을 냈다.
            #   3.12+ 는 SyntaxWarning, 앞으로 오류가 된다. `W` 전체가 아니라 이것만 켠다.
]
ignore = [
    "E501",  # 줄 길이는 formatter 가 처리
]

[tool.ruff.format]
quote-style = "double"

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
# 🚨 저장소 루트를 import 경로에 넣는다. 게이트가 `app.models` 를 읽어 CHECK 제약을
#    검사하는데(D-103 다형 참조), 이것이 없으면 ModuleNotFoundError 로 죽는다.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "gate: 거버넌스 게이트 — 실패 시 진행 불가 (D-51)",
]
