  why: '🚨 2026-09-02 — 하루에 세 번 뒤집힌 건이다. 지금은 미확인이다. ① 팀장이 「사용금지 조항」으로 미채택 → ② 근거가 kfia_approved_list(협회) 게시판 문구였음이 드러나 철회, 검토자가 「저작권/무단전재 안내 없음」으로 서명 → ③ 팀장이 같은 날 화면에서 문구를 찾았다: 「해당 정보를 무단으로 복제하거나 이용하는 경우 저작권법 등에 따라 법적책임을 질 수 있습니다」. 검토 근거가 재현되지 않으므로 서명을 보류로 되돌렸다. 🚨 kfia 문구(「단순 열람 외에 … 금지」)와는 다르다 — 여기는 「무단」이 조건이라 저작권법의 일반 원칙 재진술에 가깝고, 식약처 공공저작물이면 제24조의2 로 「무단」이 아닐 수 있다. 갈림길은 공공누리 배지다 (D-110): 부착 + 제1유형이면 출처표시만이고, 미부착이면 식약처 저작권정책의 「등록 부서와 사전 협의」 단서에 걸린다(mfds_press 와 같은 형태). 🚨 같은 날 「사용금지 조항」으로 미채택했다가 철회했다 — 근거로 삼은 유의사항이 「한국식품산업협회에는 관련 책임이 없습니다」로 시작하는 kfia_approved_list(협회) 게시판 문구였고, 이쪽(식약처 식품안전나라)이 아니었다. 두 건기식 게시판을 혼동했다. 검토자가 직접 열어 본 관찰이 이를 잡았다.'
