  why: 'AI Hub FAQ 원문: 학습해 만들어진 AI 모델과 서비스는 자유롭게 배포·활용 가능하고 영리적 판매·활용도 제한하지 않는다(출처 명시 조건). 막히는 것은 데이터를 재가공해 배포하는 행위뿐이다(NIA·구축기업 사전 협의 시 예외). 🚨 2026-09-01 이용정책 원문 확인 — 제4항 「본 AI데이터는 인공지능 학습모델의 학습용으로만 사용할 수 있습니다」, 제5항 「승인받지 않은 제3자에게 열람하게 하거나 제공·양도·대여·판매 금지」. 제7항의 주어는 「AI 데이터셋의 판매」이므로 모델 배포는 그대로 가능하고 FAQ와 모순이 아니다(그것이 NOREDIST). 그러나 제4항은 FAQ에 대응물이 없다 — RAG 원문색인과 화면인용은 학습이 아니므로 닫힌다 (D-102). 근거 화면: https://aihub.or.kr/intrcn/guid/usagepolicy.do?currMenu=151&topMenu=105'
