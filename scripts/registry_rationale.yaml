  why: 🚨 **부칙 제2조(2026-07-31 시행)가 결정적.** 2026-07-30 24:00 기점으로 개발자센터를 통한 **Search Trend API·Shopping Insight API 신규 이용 신청 접수가 중단**됐다. 유예는 그 시점까지 신청을 완료한 **기존 이용자 한정**(2027-06-30까지)이고, 이후 이용하려면 **NAVER API HUB(NCP)의 별도 절차·약관**을 따라야 한다. 우리는 기존 이용자가 아니므로 **애초에 받을 수 없다.**
