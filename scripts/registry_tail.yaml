  #    🚨 가치가 없어서가 아니다. NPR 은 가치 A 였고 지금도 A 다 — 조건이 우리와 안 맞을 뿐이다.
  - {key: nasmedia_npr, name: 나스미디어 2026 NPR 인터넷 이용자 조사, grade: G2, value: A,
     reason: "🚨 NC + PREAPPROVAL + ND 성격 — 「상업적으로 활용할 수 없습니다」 · 「인용 및 활용 시 사전 동의를 득해야」 · 「텍스트를 임의로 가공해 재인용 금지」. ①은 모두의 말뭉치가, ③은 UnSmile 이 탈락한 조항이다. 🚨 자체 조사(n=2,000)라 소급할 원본이 없다"}
  - {key: nasmedia_fb, name: 나스미디어 TrendIssue 업종 리포트 (식음료·건강기능식품), grade: G2, value: B,
     reason: "🚨 NPR 과 같은 조항. ✅ 다만 모든 장에 원본 출처가 표기돼 있어 건기식협회·식약처·엠브레인으로 소급 가능하다 — 보고서는 길잡이로만 쓰고 숫자는 원본에서 가져온다 (D-16 과 같은 처방)"}
  - {key: modu_web, name: 국립국어원 모두의 말뭉치, grade: G2, value: X,
     reason: "🚨 PREAPPROVAL — 산출물 공개마다 사전 승인이 걸리고 리드타임을 통제할 수 없다. 발표·시연영상·코드 공개가 전부 승인 대상"}
  - {key: unsmile, name: Smilegate UnSmile 혐오표현, grade: G2, value: X,
     reason: "ND(변경 금지) — 비상업이어도 개작이 막힌다. K-MHaS(CC BY-SA)로 대체"}
  - {key: kr3, name: KR3 한국 음식점 리뷰, grade: G2, value: X,
     reason: 도메인 불일치 + 제약. bab2min 네이버쇼핑 리뷰(Public Domain)로 대체}
  - {key: mdis, name: MDIS 마이크로데이터 통합서비스, grade: G2, value: X,
     reason: 승인 리드타임이 길고 KOSIS·KREI로 같은 축을 덮는다}
  - {key: x_api, name: X (구 Twitter) API v2, grade: G2, value: X,
     reason: 유료(Basic $200/월~) + 도메인 불일치}
  - {key: meta_adlibrary_api, name: Meta Ad Library API, grade: G2, value: X,
     reason: "🚨 신원확인에 수일을 쓰고 나서 국내 화장품·건기식 광고가 0건임을 확인하게 된다 (정치·사회 이슈 광고만 API 제공)"}
  - {key: aihub_63, name: AI Hub 상표 이미지 및 텍스트, grade: G3, value: X,
     reason: "라이선스가 아니라 도메인이 막는다 — 상표 심사이지 광고 표현이 아니다. 다만 거절 사유 3분류 구조는 D-59의 불가 사유 A/B/C와 형태가 같아 설계 참고만"}
