# ── 판정 완료 · 미채택 (배제가 아니라 「안 쓰기로 한 것」)
#    🚨 blocked 와 섞지 않는다. 가치가 없다는 이유로 G2 자료에 G1을 찍으면
#       등급 축 자체가 오염되고, 나중에 필요해졌을 때 재판정 비용이 생긴다.
#    실제 등급을 그대로 두고 「왜 안 쓰는가」만 기록한다 (D-72 — 가치 판정과 등급 판정은 다른 축).
not_adopted:
