  #   /api/board/...menu_grp=MENU_GRP33&menu_no=690 하나뿐이다.
  #   🚨 우리 대상은 /portal/board/...menu_grp=MENU_NEW01&menu_no=2660 으로 경로가 다르다.
  #   → 적용되는 금지 규칙 없음. 「명시적 허용」이 아니라 「금지 없음」이다.
  #   🚨 robots 는 약관·저작권 판단이 아니다 — 그 축은 constraints 가 따로 진다.
  robots_checked_at: 2026-09-02

