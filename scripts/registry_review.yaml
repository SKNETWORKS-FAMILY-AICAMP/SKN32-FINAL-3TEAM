  # 🚨 크롤링형 — robots.txt 를 사람이 열어 본 날을 적는다 (규약 6)
  #   🔄 2026-09-02 확인 (오한빈) — https://adf.kfia.or.kr/robots.txt → **HTTP 404**.
  #   RFC 9309 §2.3.1.3: robots.txt 를 못 받아오면(4xx) 크롤러는 모든 자원에 접근할 수 있다.
  #   🚨 **404 는 「규칙을 게시하지 않았다」이지 「금지한다」가 아니다.**
  #   🚨 robots.txt 는 **호스트마다 따로**다 — kfia.or.kr 에 파일이 있어도
  #      adf.kfia.or.kr 에는 적용되지 않는다. 확인한 것은 adf 호스트다.
  #   → 적용되는 금지 규칙 없음. mfds_hf_ingredient_board 때와 같은 형태이나
  #      그쪽은 「우리 경로에 해당 규칙 없음」이었고 여기는 「파일 자체가 없음」이다.
  #   🚨 이것으로 등급이 풀리지 않는다 — robots 는 「가져가도 되는가」이고
  #      G0 를 만든 것은 「쓸 수 있는가」(이용조건 미확인)다. TOS 플래그는 그대로 남는다.
  robots_checked_at: 2026-09-02

