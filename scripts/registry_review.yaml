mfds_hf_ingredient:
  decided_by: 오한빈
  decided_at: 2026-09-11   # 🔄 종전 2026-08-20 — 층·쓰임 재판정 (D-185 · 아래 주석)
  # 확인 2026-09-02 — data.go.kr 이용허락범위 = 제한 없음
  # 🚨 2026-09-02 후속 — API 유형이 **LINK** 임이 드러났다. 실제 호출은 식품안전나라
  #    (openapi.foodsafetykorea.go.kr · I-0040)이고 인증키도 그쪽에서 발급받는다.
  #    data.go.kr 에는 활용신청 버튼조차 없다.
  #    🚨 **검토자가 본 화면과 실제 이용 경로가 다르다.** 서명은 유지하되, 식품안전나라
  #    가입 시 이용약관에 추가 제약이 있으면 **재판정 대상**이다 (D-72).
  # 🔄 **2026-09-11 재판정** (D-185) — `layer` 를 `2층 적법라벨` -> `표시 문구 관측`,
  #    `value` 를 A -> B 로 내렸다. 이 표의 `FNCLTY_CN` 은 인정 문구가 아니라 **업체가
  #    신고한 표시 문구**다 — 행의 축이 업체×품목 승인이지 인정번호가 아니다 (D-167).
  #    ⛔ 종전 배치대로 두면 2024-19 「인지기능 개선에 도움을 줌」이 product_fact 에
  #       **적법 근거로** 적재된다 — 우리가 잡으려는 위반을 적법이라 가르치는 자리였다.
  #    🚨 **등급 G3 · U1~U4 allow · 재배포는 안 바뀌었다.** 바뀐 것은 층과 쓰임이다.
  #    근거: docs/ohb/hf_api_축분리_2026-09-11.md
  #
  #    🔴 **재확인 대기다.** 09-02 서명은 **08-20 판정**을 확인한 것이라 09-11 판정을
  #       덮지 못한다. 검토표 절차 3 「팀장이 재판정하고 decided_at 을 갱신」을 밟았으므로
  #       `reviewed_by` 를 비운다 — 그래야 review_sheet 가 검토 대상으로 다시 올린다.
  #    ⚠️ 비운 동안 fail-closed 로 둘이 막힌다 (설계대로다 · D-66) —
  #       ① collect.registry.require() 가 이 소스의 **재수집**을 막는다
  #       ② load_db 가 이 소스를 건너뛰어 **DB 의 layer 는 옛 값이 남는다**
  #       ★ 「새 판정이 확인 없이 DB 에 드는 것」보다 「옛 판정이 남는 것」을 골랐다.
  #    ✅ **2026-09-11 재확인 완료** — 요청 docs/ksr/재확인요청_2026-09-11_mfds_hf_ingredient.md
  #       확인한 것: 「이 표의 FNCLTY_CN 은 인정받은 문구가 아니라 업체가 신고한 표시 문구다」
  #       이견 없음. 이용 조건(G3 · U1~U4 allow · 재배포)은 09-02 확인 그대로다.
