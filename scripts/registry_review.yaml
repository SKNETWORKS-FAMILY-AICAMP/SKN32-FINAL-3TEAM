  # 확인 2026-09-02 — 게시판 정상 열림 · 게시물 존재 · 저작권/무단전재 안내 없음
  # 🔧 정정 요청 1 — 화면에 「출처 명시 필요」가 있다. constraints 에 BY 가 빠졌다 (mfds_press 와 같은 누락)
  # 🔧 정정 요청 2 — 게시물 전체 650건. 판정 근거의 568건(고시형 96 / 개별인정형 472)과 82건 차이
  # ⏸ 2026-09-02 **서명 보류로 되돌림** — 검토 근거가 재현되지 않는다.
  #    검토자는 「저작권/무단전재 안내 없음」으로 서명했으나, 팀장이 같은 날 화면에서 문구를 찾았다:
  #    「해당 정보를 무단으로 복제하거나 이용하는 경우 저작권법 등에 따라 법적책임을 질 수 있습니다」
  #    🚨 근거가 재현되지 않으면 그것이 이견이다 — 검토자 자신이 kcia_guideline 에 적용한 기준이다.
  #    확인할 것: **공공누리 배지가 붙어 있는가, 붙었다면 몇 유형인가** (D-110).
  #      · 부착 + 제1유형 → 출처표시만. 서명 복원
  #      · 미부착        → 식약처 저작권정책의 「등록 부서와 사전 협의」 단서에 걸린다 (mfds_press 와 같은 형태)
  # 서명 범위 — 09-07 등재 · 09-08 **마스킹 정책** (네 축 모두 켬 — 인정번호 484·기능성내용 432 훼손 0 확인)
  #   근거: docs/ohb/검토요청_2026-09-08_마스킹정책_3종.md
  reviewed_by: 권소라
  reviewed_at: 2026-09-08
  dissent_note: "검토 근거 「저작권/무단전재 안내 없음」이 재현되지 않음 — 화면에 「무단으로 복제하거나 이용하는 경우 저작권법 등에 따라 법적책임」 문구가 있다. 공공누리 부착 여부와 유형 확인 후 재판정 (D-110)"
  # 🚨 2026-09-07 — 이 항목의 빈 줄 때문에 mark_collected 가 두 번 헛돌았다.
  #    `collect/registry.py` 는 블록 끝을 **빈 줄**로 판단하므로, 항목 안에 빈 줄이 있으면
  #    그 뒤 필드를 **못 본다**. 「줄이 없다」는 오진이었다 — 줄은 있었고 빈 줄이 갈랐다.
  #    🚨 **원장 항목 안에 빈 줄을 넣지 않는다.**
  # ⛔ 2026-09-12 — 09-12 로 올라갔던 것을 **09-09 로 되돌린다.** 손으로 고치는 예외다.
  #    09-12 재수집은 655건 **전량 스킵 · 저장 0** 이었는데 `mfds_hf_board.py` 에
  #    `if saved:` 가드가 없어 `mark_collected` 가 찍혔다. 마지막으로 **받은** 날은 09-09 다.
  #    🚨 수집기 일곱 중 여섯이 `if saved:` 이므로 이 필드의 뜻은 「돌린 날」이 아니라
  #       **「받은 날」**이다. 가드는 같은 날 `collect/mfds_hf_board.py:205` 에 넣었다.
  collected_at: 2026-09-09
  # 크롤링형 — robots.txt 확인 (규약 6). 2026-09-02 오한빈 직접 확인:
  #   foodsafetykorea.go.kr/robots.txt 에 `User-agent: *` 그룹이 없다.
  #   선언된 것은 Googlebot 그룹 하나이고, 그 안의 Disallow 도
