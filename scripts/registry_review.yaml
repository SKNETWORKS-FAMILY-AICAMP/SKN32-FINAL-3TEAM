# ============================================================
# 2인 확인 원장 — 등급 판정의 결정·검토 기록 (D-66 · D-90 ④)
# ------------------------------------------------------------
#  🚨 이 파일이 입력이다. data_sources.yaml 은 생성물이므로
#     거기에 reviewed_by 를 손으로 적으면 다음 생성 때 사라진다.
#     (집행계약 §6 「생성 경로 — 손으로 고치지 않는 것」)
#
#  규칙
#   - decided_by 와 reviewed_by 는 서로 달라야 한다 (DB ck_source_four_eyes)
#   - 🚨 reviewed_by 가 비면 collect.registry.require() 가 수집을 거부한다
#   - collected_at 은 손으로 적지 않는다 — 수집기가 mark_collected() 로 찍는다
#   - 🔄 approved_at — GATED 소스의 **승인이 난 날**. 사람이 신청해 받아 온 사실이라
#     사람이 적는다. robots_checked_at 과 같은 종류다 (D-109).
#     🚨 비면 탐침도 수집기도 거부한다 — 「신청했다」와 「승인됐다」는 다르다.
#     approved_by 는 실제로 계정을 만들고 신청한 사람이다 (AI Hub 는 내국인 한정 3건이 있다).
#
#  절차 (S0-14)
#   1. uv run python scripts/review_sheet.py   → build/review_sheet.md
#   2. 검토자가 그 표를 보고 판정에 동의하면 여기 reviewed_by·reviewed_at 기입
#   3. uv run python scripts/gen_registry.py   → data_sources.yaml 재생성
#   4. uv run pytest -m gate
# ============================================================

