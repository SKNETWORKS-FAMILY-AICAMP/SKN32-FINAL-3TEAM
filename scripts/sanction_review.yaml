# sanction_review.yaml — **위험도 하한(`sanction_rule`) 원천 · 2인 서명 자리** (🆕 2026-10-01 · D-305 · D-308 · W5)
#
# ★ 무엇인가 — 법령 처분 기준(별표 · 조문)에서 **1차 처분**을 위반 유형마다 옮긴 행. 위험도는 처분 **종류**가 정한다(D-227 —
#   시정명령 · 시정조치 R1 · 정지 R2 · 취소 · 폐쇄 R3) — 이 파일에 위험도를 적지 않는다(`scripts/sanction_rule.py` `KIND_RISK` 한 곳 · D-99).
# ★ 누가 쓰나 — 행은 Claude 가 원문에서 옮긴 **초안**이다. 서명은 맨 아래 `signoff` 에 **사람만** 적는다(서로 다른 두 사람 · D-66).
#   🔄 2026-10-01 (D-309) — **판 단위 서명**: 두 사람이 「이 판(sha)의 대응 판단 · 누락」을 확인하고 한 번씩 적는다.
#      글자가 원문과 같은지는 `check` 가 대조한다 — 사람은 「이 목을 이 유형에 붙인 것이 맞나 · 빠진 목이 없나」를 본다.
#      🔴 행 · 형벌 · 원천 중 한 글자라도 바뀌면 sha 가 달라져 **서명이 무효**가 된다(적재기는 무효 서명을 싣지 않는다).
#      ⛔ 행마다 `verified_by` · `reviewed_by` 를 적지 않는다 — 서명 자리는 `signoff` 하나다(검사가 거부한다).
#   🚨 서명 없는 판은 적재돼도 `v_risk_lookup` 에 안 보인다(스키마 · 0013) — 서명이 곧 「하한으로 쓴다」다.
# ★ 검사 — `uv run python -m scripts.sanction_rule check` 가 행마다 **원문에서 인용과 1차 처분을 찾아** 대조한다(원문이 있는 기기 · 정본 · A).
#   못 찾으면 멈춘다 — 옮겨 적은 글자가 원문과 다르면 서명할 수 없다 (D-149 · D-220). 검토표: `build/labels/sanction_rule__검토표.csv`
#
# 범위 (D-308) — **광고 문구만 보고 알 수 있는 위반**만 담는다.
#   ⛔ 안 담는다 — 중지명령 위반 · 정지기간 중 광고 · 시정명령 불이행(①) · 실증자료 제출 불응(②) · 화장품 2.자 · 2.차(③) ·
#      자체안전관리인증기준 · GMO 미표시 · 소비기한 · 변조 · 표시사항 거짓(④ · 문구에 주장이 없다) · 식품 8 · 9 · 10호 · 심의(⑧) ·
#      뒷광고(대가 미표시 · D-255 범위 밖 — 🔄 10-01 화장품 2.다 전문가 추천 표현은 범위 안 · 기만) · 식품 축 블록 2(가금류 식육 포장 — 4호 하위 목이 소비기한 · 변조 · 자체안전관리뿐)
#   ★ 「그 밖에 부당한 표시 · 광고 → 시정명령」은 **행이 아니라 코드 기본값 R1** 이다(⑥ · 유형이 특정되지 않아 `violation_type NOT NULL` 에 못 든다)
#   ★ 사실에 달린 주장(수상 · 인증 · 원재료)은 `fact` 칸 — 판정은 보수 기록 + 사실 확인 분기(`FactBranch` · ④)
#   ★ 폐기는 `disposal` — 등급을 바꾸지 않고 설명 줄로만(⑩)
#   🆕 10-01 (D-310) `annex1` — 식품 축 4~7호 행이 **어느 [별표 1] 목에서 오나**. 하한은 **목 단위**로 대응한다 —
#      판정된 문장의 근거 인용에 그 목이 있을 때만 이 행의 처분 · 없으면 「그 밖에」 시정명령 R1(별표7 각 블록 · D-308 ⑥).
#      `[]` = 별표1 목 인용으로는 닿지 않는 행(근거가 고시 69549 3.너) — 지금은 R1 로 떨어진다. 화장품 · 1~3호는 목으로 갈리지 않아 칸이 없다
#   ★ 업종 블록이 여럿이면 **유형마다 행을 다 싣는다** — 하한은 같은 축 안에서 max(D-227 「업종은 언제나 max」)

