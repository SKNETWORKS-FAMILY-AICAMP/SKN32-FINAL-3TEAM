# ============================================================
# CopyLane 소스 레지스트리 (D-15 · D-18 · D-22 · D-23 · D-71 · D-72 · D-89)
# ------------------------------------------------------------
# 작성자: 오한빈 (팀장) · 최종 갱신 2026-08-31
#
# 등재 단위 — 「데이터셋」이 아니라 「이용조건」이다.
#   법제처 OPEN API로 받는 11종(법령·별표·고시·지침·재결례·판례)은 OC 키 하나로
#   같은 조건 아래 받으므로 law_go_kr 1건으로 묶고 covers 로 편다.
#   반대로 AI Hub 6종은 데이터셋마다 승인 상태가 따로 흐르므로 각각 등재한다.
#
# 규칙
#  - 여기 등록되지 않았거나 grade가 G1이면 수집 스크립트가 실행을 거부한다.
#  - grade: G3(원문 자유) / G2(사실만 추출) / G1(배제) / G0(미표기·미확인)
#  - use:   U1 학습 · U2 RAG 원문색인 · U3 화면인용 · U4 배포   (각각 allow/deny)
#  - constraints: BY / NC / SA / PII / TOS / GATED
#                 + NOREDIST (데이터 재가공·배포 금지 — D-71)
#                 + NOSTORE (저장·별도DB 금지) / QUERYLOG (요청이 제공자에 보관됨) /
#                   PREAPPROVAL (결과물 공개 전 사전승인)  — D-73
#                 🚨 NOREDIST는 U4(모델 배포)를 막지 않는다. 축이 다르다 (D-71)
#
# 🚨 등급이 허용하는 용도 상한 — tests/test_governance_layout.py 가 검사한다
#
#      등급 │ U1 학습 │ U2 원문색인 │ U3 화면인용 │ U4 배포
#      ─────┼─────────┼─────────────┼─────────────┼─────────
#      G3   │  가능   │    가능     │    가능     │  가능
#      G2   │  가능   │ 🚨 deny 고정│ 🚨 deny 고정│  가능      ← 사실만 · 원문 미보관
#      G1   │  deny   │    deny     │    deny     │  deny
#      G0   │  deny   │    deny     │    deny     │  deny      ← 미확인은 닫는다 (fail-closed)
#
#    G2에 U2·U3가 닫히는 것은 정책이 아니라 정의다 — 원문을 보관하지 않기로 한 등급에
#    원문 색인과 원문 인용을 열어 두면 등급 표기가 거짓이 된다.
#    G0는 「G2 취급」이지만 용도는 확인 전까지 전부 닫는다. 확인 후 2인 판정으로 승격한다 (D-72).
#
#  - redistributable: 데이터셋 자체를 공개 배포할 수 있는가. NOREDIST와 짝이다 (D-71).
#      🚨 골든셋에 redistributable:false 소스가 한 문장이라도 섞이면 그 골든셋 전체를
#         공개할 수 없다. 프래그먼트 단위로 provenance를 남기지 않으면 나중에 되돌릴 수 없다.
#  - status: 🚨 「수집기가 이 소스를 실행하는가」 하나만 뜻한다 — 작업 목록이 아니다 (D-108)
#
#      값       │ 뜻                                        │ use 와의 관계
#      ─────────┼───────────────────────────────────────────┼──────────────────────────
#      collect  │ 자동 수집기가 실행한다                    │ 🚨 최소 하나 allow (게이트 22)
#      manual   │ 사람이 수기로만 — 자동 수집은 약관 위반    │ 제약 없음 (경로가 다르다)
#      hold     │ 이번 범위 밖 — 착수 전 또는 선결 조건 대기 │ 제약 없음 (열려 있어도 정상)
#
#    아무 용도도 열리지 않은 소스를 자동으로 가져오는 것은 판정 없이 원문을 손에 쥐는 일이다.
#    G0 를 fail-closed 로 닫아 둔 이유(D-72)가 수집 단계에서 우회된다. 그래서 collect 에만 건다.
#    🚨 역은 성립하지 않는다 — hold 인데 용도가 열려 있는 것은 「판정 끝, 착수만 남음」이다.
#    blocked · not_adopted 는 status 값이 아니라 별도 섹션이다. 스키마부터 다르다(name/grade/reason).
#  - value: A~D 활용 가치 (D-72 — 가치를 등급보다 먼저 본다)
#  - 등급은 소스의 "기본값"이며 실제 판정 단위는 FRAGMENT (D-18)
#  - 경계 케이스(G1/G2, G2/G3)는 2인 판정 후 reviewed_by 기록
#      🚨 collected_at 이 채워진 소스는 reviewed_by 가 반드시 있어야 한다 (게이트).
#         수집을 시작했다는 것은 판정이 끝났다는 뜻이다.
#  - 모델 가중치도 이 레지스트리의 대상이다 (D-23, 하단 models 섹션)
# ============================================================

