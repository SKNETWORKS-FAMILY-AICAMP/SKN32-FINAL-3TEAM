<!doctype html>
<html lang="ko" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{border:1.5px solid var(--line);border-radius:16px;padding:30px 32px 32px;background:var(--surface-2);position:relative}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.ico{width:52px;height:52px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.n{font-size:18px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.card h3{margin-top:22px;font-size:27px;font-weight:700;letter-spacing:-0.025em;line-height:1.3}
.card p{margin-top:12px;font-size:19px;line-height:1.6;color:var(--muted);text-wrap:pretty}
</style></head>
<body><div class="frame">
  <div class="head"><div class="bar"></div><h1>우리가 지키는 네 가지</h1></div>
  <div class="grid">
    <div class="card">
      <div class="top"><div class="ico">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 25 L10.5 3"/><path d="M23 25 L17.5 3"/><path d="M14 24.5v-3.5M14 16.5v-3.5M14 8.5V5.5" /></svg>
      </div><span class="n">1</span></div>
      <h3>경계는 법이 긋는다</h3>
      <p>근거 조문 없이 판정하지 않습니다.<br>이름의 Lane 은 법령이 그은 차선입니다.</p>
    </div>
    <div class="card">
      <div class="top"><div class="ico">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h15A2.5 2.5 0 0 1 24 6.5v11a2.5 2.5 0 0 1-2.5 2.5H12l-5.5 4.5V20h0A2.5 2.5 0 0 1 4 17.5z"/><path d="M11.5 10a2.5 2.5 0 1 1 3.6 2.25c-.7.35-1.1.9-1.1 1.65v.3"/><path d="M14 17.2v.1"/></svg>
      </div><span class="n">2</span></div>
      <h3>모르면 묻는다</h3>
      <p>품목 · 인정 여부 · 실증 자료처럼 문구만으로 알 수 없는 사실은 추측하지 않고 질문합니다.</p>
    </div>
    <div class="card">
      <div class="top"><div class="ico">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="14" cy="14" r="10.5"/><path d="M11 9.5v9M17 9.5v9"/></svg>
      </div><span class="n">3</span></div>
      <h3>틀린 통과보다 정직한 보류</h3>
      <p>위반을 못 찾은 것은 적법이 아닙니다.<br>확신할 때만 확정합니다.</p>
    </div>
    <div class="card">
      <div class="top"><div class="ico">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7.5A2.5 2.5 0 0 0 5 7.5v4L3 14l2 2.5v4A2.5 2.5 0 0 0 7.5 23H9"/><path d="M19 5h1.5A2.5 2.5 0 0 1 23 7.5v4l2 2.5-2 2.5v4a2.5 2.5 0 0 1-2.5 2.5H19"/><path d="M10 14.2l2.8 2.8 5.2-6"/></svg>
      </div><span class="n">4</span></div>
      <h3>규칙은 코드가 지킨다</h3>
      <p>등록되지 않은 데이터는 수집 자체가 막히고, 2인 확인 · 시험이 원칙을 지킵니다.</p>
    </div>
  </div>
</div></body></html>
