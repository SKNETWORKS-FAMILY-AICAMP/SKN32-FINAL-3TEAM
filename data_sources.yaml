      질병예방치료·의약품혼동·건강기능식품혼동 → 3종 / 거짓·과장·기만 → 2종 / 부당한 비교·비방 → 부당_비교광고.
      🚨 `후기_체험기_기만` 이 해설서에 없다 — 「엄마들의 경험담을 직접 확인하세요!」가 거짓·과장·기만이다.
    caution: "🚨🚨 제도 시점이 어긋난다 — 3층(판단규범)에 넣지 않는다(D-138). 목적 조항이 근거를 직접 적는다: 「식품위생법」제12조의3의 규정에 따라 … 식품의약품안전처장(한국식품산업협회에 위탁)의 심의를 받을 때」. 현행법(law_013094 식품 등의 표시·광고에 관한 법률)은 제10조 「표시 또는 광고의 자율심의」다 — 사전심의 → 자율심의로 바뀌기 전 자료다. 문서 스스로도 「법적 구속력을 가지는 것은 아니므로 … 관련 법령 및 고시 전문을 확인」하라고 적는다. 1층 사례로만 쓰고 심의제도·연도를 필수 필드로 남긴다. / 🚨 현행 수집기로는 못 받는다 — 첨부가 hwp 단독인데 collect/mfds_board.py 는 「PDF 만 받는다」. 대안: 사이트 자체 문서변환(/common/convertDocViewer.do)이 hwp→xhtml 을 주고 텍스트가 그대로 나온다. 🚨 다만 표 셀이 줄로 흩어져 「유형 │ 내용」 대응이 무너진다 — 라벨 정확도가 필요하면 hwp 원본 표 파싱이 낫다. / 🚨 라벨 체계가 우리 것과 어긋난다(D-139): 해설서 3분류(질병예방치료·의약품혼동·건강기능식품혼동 / 거짓·과장·기만 / 부당한 비교·비방)가 VIOLATION_TYPES 6종을 3→1, 2→1 로 뭉친다. 후기_체험기_기만이 해설서에 없고 「엄마들의 경험담을 직접 확인하세요!」가 거짓·과장·기만으로 분류돼 있다. / 🚨 정확한 문구 건수는 표 파싱 후에 말한다 — 뷰어 텍스트 자동 집계는 블록 경계가 새어 신뢰할 수 없다."
    collected_at: 2026-09-08
    decided_at: 2026-09-07
    decided_by: 오한빈
    reviewed_by: 권소라
