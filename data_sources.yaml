  # 🔄 2026-09-02 — PDF 마지막 장의 이용조건을 직접 열어 확인하고 내렸다 (D-110).
  #    🚨 가치가 없어서가 아니다. NPR 은 가치 A 였고 지금도 A 다 — 조건이 우리와 안 맞을 뿐이다.
  - {key: nasmedia_npr, name: 나스미디어 2026 NPR 인터넷 이용자 조사, grade: G2, value: A,
     reason: "🚨 NC + PREAPPROVAL + ND 성격 — 「상업적으로 활용할 수 없습니다」 · 「인용 및 활용 시 사전 동의를 득해야」 · 「텍스트를 임의로 가공해 재인용 금지」. ①은 모두의 말뭉치가, ③은 UnSmile 이 탈락한 조항이다. 🚨 자체 조사(n=2,000)라 소급할 원본이 없다"}
  - {key: nasmedia_fb, name: 나스미디어 TrendIssue 업종 리포트 (식음료·건강기능식품), grade: G2, value: B,
     reason: "🚨 NPR 과 같은 조항. ✅ 다만 모든 장에 원본 출처가 표기돼 있어 건기식협회·식약처·엠브레인으로 소급 가능하다 — 보고서는 길잡이로만 쓰고 숫자는 원본에서 가져온다 (D-16 과 같은 처방)"}
  - {key: modu_web, name: 국립국어원 모두의 말뭉치, grade: G2, value: X,
     reason: "🚨 PREAPPROVAL — 산출물 공개마다 사전 승인이 걸리고 리드타임을 통제할 수 없다. 발표·시연영상·코드 공개가 전부 승인 대상"}
  - {key: unsmile, name: Smilegate UnSmile 혐오표현, grade: G2, value: X,
     reason: "ND(변경 금지) — 비상업이어도 개작이 막힌다. K-MHaS(CC BY-SA)로 대체"}
  - {key: kr3, name: KR3 한국 음식점 리뷰, grade: G2, value: X,
     reason: 도메인 불일치 + 제약. bab2min 네이버쇼핑 리뷰(Public Domain)로 대체}
  - {key: mdis, name: MDIS 마이크로데이터 통합서비스, grade: G2, value: X,
     reason: 승인 리드타임이 길고 KOSIS·KREI로 같은 축을 덮는다}
  - {key: x_api, name: X (구 Twitter) API v2, grade: G2, value: X,
     reason: 유료(Basic $200/월~) + 도메인 불일치}
  - {key: meta_adlibrary_api, name: Meta Ad Library API, grade: G2, value: X,
     reason: "🚨 신원확인에 수일을 쓰고 나서 국내 화장품·건기식 광고가 0건임을 확인하게 된다 (정치·사회 이슈 광고만 API 제공)"}
  - {key: aihub_63, name: AI Hub 상표 이미지 및 텍스트, grade: G3, value: X,
     reason: "라이선스가 아니라 도메인이 막는다 — 상표 심사이지 광고 표현이 아니다. 다만 거절 사유 3분류 구조는 D-59의 불가 사유 A/B/C와 형태가 같아 설계 참고만"}
  - {key: mnm_aidataset, name: MarketsandMarkets AI 학습 데이터셋 시장 보고서, grade: G2, value: D,
     reason: "$4,950 · 시장 정의가 우리 제품과 다르다. D-75에 따라 자체 산출로 대체"}
  # 🚨 klue_roberta 는 여기 없다 (D-106). 아래 `models:` 에 G1 로 등재돼 있고 그것이 단일 출처다.
  #    not_adopted 는 「후보였다가 안 쓴 것」이고 models 는 「등재해서 게이트 대상인 것」이다.
  #    D-70 교체 때 models 에 남긴 채 not_adopted 에도 적어 두 벌이 됐고,
  #    등급을 G1 로 내리자 게이트 11 이 그것을 잡았다 — 「G1 은 미채택이 아니라 배제다」.
  - {key: exaone, name: EXAONE 계열, grade: G0, value: X,
     reason: 라이선스 제약. Qwen3 4B(Apache 2.0)로 간다 (D-23)}

models:  # 모델 가중치도 G-게이트 대상이다 (D-23)
  # 🚨 use.U4 는 「이 가중치를 배포물에 넣어도 되는가」다. 주석이 아니라 필드로 둔다 —
  #    주석은 게이트가 읽지 못하고, 학습 설정에 잘못 들어가도 아무것도 실패하지 않는다.
  qwen3_4b:
    role: sLLM
    license: Apache-2.0
    grade: G3
    use: {U1: allow, U2: deny, U3: deny, U4: allow}
  kure_v1:
    role: 임베딩
    license: MIT
    grade: G3
    use: {U1: allow, U2: deny, U3: deny, U4: allow}
  bge_reranker_v2_m3:
    role: 리랭커 (현행 · 0.6B)
    license: Apache-2.0
    grade: G3
    use: {U1: allow, U2: deny, U3: deny, U4: allow}
  bge_reranker_base:
    role: 리랭커 (후보 · 0.3B — D-84 ③)
    license: MIT
    grade: G3
    use: {U1: allow, U2: deny, U3: deny, U4: allow}
    note: 메모리·응답시간 최적화 1순위 자리. 성능 델타를 재고 유의하지 않으면 이쪽이 맞다
  kcbert_base:
    role: 인코더 (주 백본 — D-70)
    license: Apache-2.0
    grade: G3
    use: {U1: allow, U2: deny, U3: deny, U4: allow}
  # 🚨 G0 가 아니라 G1 이다 (D-106). G0 는 「미표기·미확인」인데 이것은 네 경로로
  #    확인해서 「없다」를 알아낸 상태다 — 확인 결과가 「허락 없음」이면 배제다.
  #    비교군 유지(D-70 마지막 문장)는 D-106 으로 철회했다. 지우지 않고 사유와 함께 남긴다 (D-21).
  klue_roberta:
    role: ✕ 배제 — 비교군으로도 쓰지 않는다
    license: 없음
    grade: G1
    use: {U1: deny, U2: deny, U3: deny, U4: deny}
    note: >-
      🚨 라이선스 부재를 확인했다 (D-70) — HF 모델 카드·API JSON·cardData·tags·GitHub README
      다섯 경로 전부에 license 키가 없다. 「사용은 되고 배포만 안 된다」는 구분은 라이선스가
      있을 때 성립하는 것이고, 없으면 그 구분을 해 줄 문서 자체가 없다.
      비교군 실익도 없다 — D-70 이 (a) 문의를 「회신 시점 통제 불가」로 기각했으므로
      비교에서 앞서도 쓸 수 없다. 백본 선택 근거는 kcbert-base × KcELECTRA-base 로 충분하다.
