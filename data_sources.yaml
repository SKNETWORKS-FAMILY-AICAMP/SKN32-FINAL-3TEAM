      🚨 2026-09-02 의결서 실물 확인 — 피심인 항목에 **사업장 주소와 대표이사 성명**이 전면에
      나온다(「서울특별시 종로구 서린동 88 · 대표이사 임충헌」). 종전 masking 문구에 주소가 빠져 있었다.
    fragment_note: 광고 화면 캡처 이미지는 G1~G2로 개별 하향 (D-18)
    caution: "★★★ 2026-09-02 의결서 실물 확인 — 화장품 건이 존재한다(오한빈). 의결 제2000-99호 「한국화장품(주) 및 (주)혜명교역의 부당한 광고행위에 대한 건」. 🚨 식약처 행정처분 5종이 전부 식품이라 비어 있던 화장품 자리를 이것이 메운다 — 표시광고법은 업종을 안 가린다. 1층이 선다. ★★ 구조가 학습 라벨에 그대로 맞는다 — 「주문」이 금지 문구를 원문 인용으로 적시하고(예: '바르는게 운동입니다' · '미국의 FDA … 통과하여 국제적으로 인정'), 그 뒤에 위반 유형(비만완화 효과가 있는 것처럼 · 합격판정을 받은 것처럼)이 붙으며, 「판단」이 왜 부당한지를 적는다(실증자료가 임상실험이 아니라 설문조사 100명). 입력·라벨·근거가 한 문서에 다 있다 (D-59 A/B/C 와 같은 형태). 🚨 확인이 남는 것 셋 — ① 시점 분포: 이 건은 2000년이고 매체가 신문·잡지다. 현재 온라인 광고와 표현이 다를 수 있어 최근 건 비중을 봐야 한다 ② 파일데이터의 실체: 의결서가 PDF 인데 15103301 이 PDF 묶음인지 메타데이터 CSV 인지 ③ 마스킹 범위: 업체명·대표자명·주소가 전면에 나온다 — masking 필드가 이미 붙어 있으나 주소까지 포함해야 한다 (D-17). / ★★ 2026-09-02 표시광고법 필터 코드 확인(오한빈) — 공정위 사건처리 검색화면(case.ftc.go.kr)의 위반유형 파라미터가 <code>reprsntVioltTy=0609*</code> 다. 🚨 와일드카드가 붙어 하위 유형을 전부 포함한다 — 표시광고법 제3조의 넷(거짓·과장 / 기만적 / 부당하게 비교하는 / 비방적인 표시·광고)이 다 걸린다. 키워드 검색(「부당한 광고」)으로는 표현이 다른 건이 빠진다 — 유형 코드로 걸러야 한다. 🚨 다만 이건 검색화면의 코드이지 파일데이터의 컬럼값이 아닐 수 있다 — 파일을 열어 위반유형 컬럼의 실제 표기를 확인해야 필터가 선다. 🚨 case.ftc.go.kr 은 레지스트리에 없는 별도 접근 경로다 — 2인 확인이 덮는 것은 data.go.kr 파일데이터(15103301)다. 사람이 눈으로 세는 것은 무방하나 자동 수집하려면 등재·판정이 선행이다 (D-15). / 🚨 프래그먼트별로 등급이 갈린다 — 의결서 안 <그림 N> 광고 캡처는 광고주 이미지 저작물이라 G1(미추출). 업체명·대표자명은 등급 무관 즉시 마스킹."
