    masking: >-
      업체명·대표자명·상표·주소 즉시 마스킹, 원문 미보관 (D-17). 2026-09-08 판정 · 2인 확인.
      🚨 위반 업체가 아니라 **인정을 받은 업체**다 — 공표된 제재가 아니라 행정 인정 사실이다.
      🔴 **`인정번호`와 `기능성내용`은 반드시 남는다** (D-156) — 판정이 「표현 + 제품 지위」의
      함수라, 인정번호를 지우면 라벨이 성립하지 않는다.
      실측(`apply_policy` 순서 그대로) — 업체명 450건 지워지고 **인정번호 484건 중 0건 ·
      기능성내용 432건 중 0건**이 바뀐다.
    fragment_note: >-
      ★ **게시물 본문만 취한다** — 원료명 · 인정번호 · **기능성내용** · 일일섭취량 · 섭취 시 주의사항.
      🚨 **첨부 「소비자 리포트」 PDF 는 취하지 않는다.** 1쪽에 이렇게 적혀 있다:
      「소비자 이해를 돕기 위하여 작성하였으며 **건강기능식품 판매 목적의 표시·광고 또는
      홍보 수단으로 사용할 수 없음**을 알려드립니다」.
      🚨 **이 프로젝트에서 그 금지는 남의 일이 아니다** — 우리 제품은 광고 문구를 **생성**한다.
      PDF 의 「12주간 섭취시킨 결과 체지방률이 대조군 대비 유의적으로 개선되었음」 같은
      인체적용시험 서술이 학습에 들어가면, 생성 모델이 그 문장을 뱉고 사용자가 광고에 쓴다.
      **그것이 정확히 우리가 막으려는 부당광고다.** 원천이 스스로 금지한 것을 우리가 유통하는 꼴이 된다.
      ✅ 반면 **기능성내용 문구는 취해도 된다** — 「체지방 감소에 도움을 줄 수 있음」은 인정 사실이고
      제품 라벨에 실제로 찍히는 법정 표시사항이다. 금지된 것은 **리포트를 광고 수단으로 쓰는 것**이지
      인정 문구 자체가 아니다.
      🚨 **업체명은 취하지 않는다** — 제재 맥락은 아니지만(D-17 과 사유가 다르다) 학습 데이터에
      회사명이 들어갈 이유가 없다.
      ★ 영문판 병기 · 관련 규정은 「건강기능식품 기능성 원료 및 기준·규격 인정에 관한 규정」 제15조 —
      law_go_kr covers 에 이 규정이 있는지 확인이 남는다.
    caution: "🔧 2026-09-02 정정 2건(권소라 §6-3·4) — ① 화면에 「출처 명시 필요」가 있어 BY 를 붙였다(mfds_press 와 같은 누락이었다) ② 게시물 전체 650건으로 종전 568건과 82건 차이. 어느 쪽이 맞는지는 수집 시 실측한다. / API 15074311(개별인정형 472)과 겹치는 범위 확인이 남는다. ★★ 2026-09-02 게시물 본문 실물 확인(오한빈) — PDF 가 아니라 HTML 본문이고 「○ 키 : 값」으로 구조화돼 있다. 원료명 · 인정번호 · 업체명 · 기능성내용 · 일일섭취량 · 섭취 시 주의사항 (+ 영문판 병기). 🚨 「기능성내용 : 체지방 감소에 도움을 줄 수 있음」이 곧 승인된 표시 문구다 — 2층이 찾던 「어떤 표현이 승인되나」의 답이 여기 있다. API(15058359)가 이걸 주는지는 아직 모르지만 게시판에는 확실히 있고 2인 확인도 끝났다. 수집기는 목록 페이징 → 상세 HTML 저장이면 되고, 「○ 키 : 값」 파싱은 전처리가 한다(규약 2 — 수집기는 원본을 저장하고 파싱하지 않는다)."
    collected_at: 2026-09-07
