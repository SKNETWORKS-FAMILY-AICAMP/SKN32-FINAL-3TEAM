    use: {U1: allow, U2: allow, U3: allow, U4: allow}
    constraints: []
    masking: 업체명·상표·대표자명 즉시 마스킹, 원문 미보관 (D-17)
    fragment_note: 광고 화면 캡처 이미지는 G1~G2로 개별 하향 (D-18)
    access: 공식다운로드/API
    collected_at: null
    decided_at: 2026-08-14
    decided_by: 오한빈
    reviewed_by: null
    evidence_url: https://www.data.go.kr/data/15103301/fileData.do

  law_go_kr:
    name: 법제처 국가법령정보 OPEN API (법령·시행령·시행규칙·행정규칙/고시)
    url: https://open.law.go.kr/LSO/openApi/guideList.do
    grade: G3
    use: {U1: allow, U2: allow, U3: allow, U4: allow}
    constraints: []
    access: API (OC 키 필요 — .env LAW_OC_KEY)
    collected_at: null
    decided_at: 2026-08-14
    decided_by: 오한빈
    reviewed_by: null

  mfds_press:
    name: 식약처 온라인 부당광고 점검 보도자료
    grade: G3            # 확인 필요 플래그 유지
    use: {U1: allow, U2: allow, U3: allow, U4: allow}
    constraints: []
    note: 키워드+집계만 공개, 전체 문구는 이미지 캡처인 경우 있음
