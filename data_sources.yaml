  kfia_approved_list:
    name: 기능성표시식품 심의완료 공개목록 (적법 라벨 + 합법 어휘 사전 원천)
    url: https://adf.kfia.or.kr/company/open/openData.do?menuKey=406
    # 🚨 URL 확인 필요 (D-80 ⑤) — 검색에서 「한국건강기능식품협회 기능성표시 광고심의」로
    #    잡히는 것은 ad.khff.or.kr 이다. 공개목록 위치가 이전되었을 수 있으므로
    #    수집 착수 전에 실제 접속 확인. 10장 즉시할일 6번의 선결 조건.
    grade: G0            # → G2 취급. 문의 확정 시 승격
    use: {U1: allow, U2: allow, U3: deny, U4: deny}
    constraints: [TOS]
    decided_at: 2026-08-14
    decided_by: 오한빈
    reviewed_by: null

  kcia_guideline:
    name: 대한화장품협회 광고자문 기준(해설서)
    url: https://kcia.or.kr/inc/down.php?dir=BOARD&file_name=202303_167929681468454_1.pdf
    grade: G0            # → G2 취급. 이용조건 문의 발송 (W1 월요일)
    use: {U1: deny, U2: deny, U3: deny, U4: deny}   # 사실(표현 목록)만 추출, 해설 문장 금지 (D-16)
    constraints: [TOS]
    note: 금지/허용 표현 목록은 원 출처(화장품법·고시)로 소급해 G3화 (D-16)
    decided_at: 2026-08-14
    decided_by: 오한빈
    reviewed_by: null

  aihub_review_corpus:
    name: AI Hub 한국어 리뷰·감성 코퍼스 (세그먼트 구획용 — 어휘 1차 소스 아님, D-28)
