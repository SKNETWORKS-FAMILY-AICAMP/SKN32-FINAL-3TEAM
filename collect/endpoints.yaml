mfds_sanctions:          # 15059500 식약처 행정처분결과
  # ✅ 2026-09-02 해소 — **I0470 확정.** 근거 둘, 둘 다 재현 가능하다:
  #    ① selectApiLinkUrl.do(15059500) 의 linkUrl 이 …&svc_no=I0470 이다 (LINK 유형).
  #    ② data.go.kr 15059500 설명의 속성 17개와 식품안전나라 I0470 「출력항목」 17개가
  #       순서까지 1:1 로 같다 — 업소명·업종·인허가번호·처분확정일자·처분시작일·처분종료일·
  #       처분유형·위반일자및위반내용·주소·전화번호·대표자명·처분내용·위반법령·공개기한·
  #       최종수정일·처분기관명·행정처분전산키.
  #    → I0480/I0481/I0482/I2630(업종별 분할)이 아니다.
  # 🚨 serviceId 에 **하이픈이 없다** — I-0040·I-0050 과 형식이 다르다. 화면 그대로 적는다.
  # ⓘ 다섯 전부 「식품」이라 여기에 화장품 행정처분이 없다. **그러나 1층에 구멍은 아니다** —
  #    🔄 2026-09-02 18:11 (커밋 3a1e894) **S0-17-c 해소.** 화장품 부당광고의 1층 축은
  #    공정위 의결서(`ftc_decisions`)다. 표시광고법은 업종을 안 가린다 —
  #    의결 제2000-99호 「한국화장품(주) 부당한 광고행위」 실물 확인.
  #    화장품의 행정처분 「기준」은 4층에서 화장품법 시행규칙 [별표]로 들어온다 (법제처).
  #    🚨 이 주석의 앞 판(17:47)은 그 확인 **24분 전**에 쓰여 「1층의 절반이 빌 수 있다」고
  #       적혀 있었다. 정본은 docs/03_데이터/수집리스트.md 의 S0-17 표다.
  # 🚨 **남아 있는 것은 S0-17-b 다** — 이 소스는 두 번 깎인다: 업종으로 한 번(식품만),
  #    위반유형으로 한 번(광고만). `LAWORD_CD_NM` 이 그 둘째를 세는 축이고,
  #    실측 전까지 이 소스의 가치 A 는 가정이다.
  # 🚨 필드 매핑 — 1층이 쓸 것과 마스킹할 것이 한 응답에 같이 온다:
  #    쓸 것   LAWORD_CD_NM(위반법령) ← 「식품 등의 표시·광고에 관한 법률」 필터축 ·
  #            VILTCN(위반일자및위반내용) · DSPS_TYPECD_NM(처분유형) · DSPS_DCSNDT(처분확정일자)
  #    가릴 것 PRCSCITYPOINT_BSSHNM(업소명) · ADDR(주소) · TELNO(전화번호) · PRSDNT_NM(대표자명)
  # 🚨 선택 파라미터 CHNG_DT(변경일자) · DSPS_DCSNDT(확정일자) · LCNS_NO(인허가번호) 가 있다.
  #    증분 수집은 CHNG_DT 로 한다 — 지금은 붙이지 않는다(전량 1회 후 결정).
  # ✅ 2026-09-02 팀장 확인 — **FOODSAFETY_KEY 하나로 I0470 이 열린다.**
  #    I-0040 승인으로 받은 키인데 서비스별 재신청 없이 통과했다.
  #    → 식품안전나라의 인증키는 **계정 단위**이지 서비스 단위가 아니다.
  #    같은 근거로 I-0050(mfds_hf_individual)도 별도 신청이 필요 없다.
  #    🚨 data.go.kr(query 형)은 반대다 — 거기는 **데이터셋마다 활용신청**이 따로다.
  #       같은 「오픈API」라는 말이 같은 신청 단위를 뜻하지 않는다.
  url: http://openapi.foodsafetykorea.go.kr/api
  style: path
  fmt: json
  # ✅ 2026-09-02 첫 수집 성공 — total_count **5,378** (54장). 최상위 키는 `I0470`(하이픈 없음).
  # 🚨 첫 장 100건에 **「식품 등의 표시·광고에 관한 법률」이 0건**이다. 다만 **표본이 아니다** —
  #    처분확정일자가 20240903~20241007 5주치뿐이고, 처분유형이 영업소폐쇄 77 · 허가취소 23
  #    **둘뿐**이다. 광고 위반의 전형인 영업정지·품목제조정지가 첫 장에 하나도 없다.
  #    🚨 I0470 이 폐쇄·취소만 담는다면 광고 건은 I0480/I0481/I0482/I2630 에 있다는 뜻이 되고
  #       이 엔드포인트 판정이 다시 열린다. **전량(54장)을 받아야 답이 나온다.**
  # ✅ D-109 표의 「위반내용이 자연어인지 코드인지」 → **구조화된 문자열**이다:
  #    LAWORD_CD_NM = "법령명 제N조(조문제목) M항". 법령명이 맨 앞이라 접두 매칭으로 정확히 거른다.
  #    🚨 법령명에 **가운뎃점**이 있다 — 정규화 후 비교한다(법제처 검색에서 `표시·광고` 가 0건
  #       나왔던 것과 같은 함정). VILTCN 은 "(YYYYMMDD)위반내용" 이라 날짜 접두를 분리한다.
  service_id: I0470
  params: {}

ftc_decisions_api:       # 15103246 공정위 결정문 목록 조회
  # 🚨🚨 **채우지 않는다.** 주소는 알아냈으나 이 파일의 스키마로 표현할 수 없다.
  #
  # 확인된 것 (2026-09-02, 전부 재현 가능):
  #   · API 유형 **LINK**. selectApiLinkUrl.do(15103246) 의 linkUrl 이
  #     https://open.law.go.kr/LSO/openApi/guideResult.do?htmlName=cmtListGuide#ftc
  #     → 🚨 호출처가 공정위가 아니라 **법제처 국가법령정보 공동활용**이다.
  #       (case.ftc.go.kr 이 아니다 — 다른 경로다)
  #   · 요청 URL  https://www.law.go.kr/DRF/lawSearch.do
  #   · 파라미터  OC(필수, 인증값) · target=ftc(필수) · type=HTML|XML(필수) ·
  #              search(1=사건명 2=본문) · query · display(max 100) · page · sort
  #   · 응답 XML  <Ftc> … <totalCnt> · <ftc id=n> 안에 결정문일련번호 · 사건명 · 사건번호 ·
  #              문서유형 · 회의종류 · 결정번호 · 결정일자 · 결정문상세링크
  #   · 본문은 별도 호출  /DRF/lawService.do?OC=..&target=ftc&ID=<일련번호>&type=HTML
  #
  # 🚨 막는 것 넷 — 하나라도 남으면 url 을 적는 순간 수집기가 **틀린 요청**을 보낸다:
  #   ① 인증 파라미터가 `OC` 다. openapi.py:68 은 `serviceKey` 를 고정으로 붙인다.
  #   ② 키가 DATA_GO_KR_KEY 가 아니다. 🔄 정정 — **.env 이름은 이미 있다**:
  #      `LAW_OC_KEY` (.env.example:37, 2026-08-20 승인 완료, `law_go_kr` 가 쓰는 것과 같은 값).
  #      막는 것은 이름이 아니라 `openapi.py:107` 이 **style 로만 키를 고른다**는 것이다.
  #   ③ 페이징 변수가 pageNo/numOfRows 가 아니라 **page/display** 다.
  #   ④ 응답이 **XML 전용**이다 (data.go.kr 데이터포맷도 XML). total_of() 는 JSON 만 읽어
  #      None 을 내고, 종료 조건이 `len(payload) < 200` 으로 떨어진다 — XML 은 빈 장도 200바이트를
  #      넘어 **멈추지 않는다.** 저장 파일명도 page_0001.json 으로 붙는다.
  #
  # → 필요한 것은 이 파일의 값이 아니라 **수집기 확장 결정**이다:
  #    auth_param / auth_env / page_param / rows_param / xml 파서 · 저장 확장자.
  #    결정 전까지 url 은 null 로 둔다 — 「틀린 주소는 빈 칸보다 나쁘다」.
  #
  # ⓘ 급한 일이 아니다 — 레지스트리가 이 소스를 `scale: "증분 갱신용"` 으로 적어 뒀다.
  #    1층의 본체는 파일데이터 `ftc_decisions`(15103301, 5,870건)다. 그쪽 하나로 1층이 선다.
  # 🚨 정작 빠진 것은 **본문 API 15103247** 이다 — 기획문서 1층은 의결서 경로를 셋
  #    (파일데이터 15103301 · 목록 15103246 · **본문 15103247**)으로 적어 뒀는데
  #    레지스트리에 15103247 이 **등재 자체가 없다.** 목록 API 만으로는 사건명·결정일자뿐이라
  #    광고 문구가 나오지 않는다. 증분 경로를 살릴 거면 먼저 등재·판정할 것은 이쪽이다 (D-15).
  #
  # ❗ 거버넌스 — 2인 확인이 덮는 것은 data.go.kr 15103246(이용허락범위 제한 없음)인데
  #    실제 호출은 법제처다. 미서명 소스 `law_go_kr` 와 **같은 포털·같은 키 체계**이므로
  #    두 건의 판정이 서로를 가리킨다. 함께 판정하는 것이 맞다.
  url: null
  fmt: xml
  style: query
  params: {}

cosmetic_ingredient:     # 15111774 화장품 원료성분정보
  # ✅ 2026-09-02 해소 — **API 유형 REST** (LINK 아님. linkUrl 이 null 로 온다).
  #    스펙 출처: 상세 화면 Swagger 의 ui.specSelectors.specJson() — 화면 표와 같은 값이다.
  #    Base URL  apis.data.go.kr/1471000/CsmtcsIngdCpntInfoService01
