# ============================================================
# 오픈API 요청주소 — 수집기가 실제로 부르는 곳
# ------------------------------------------------------------
#  🚨 레지스트리의 url 은 **포털 소개 페이지**이고 엔드포인트가 아니다.
#     data_sources.yaml 에 넣지 않는 이유: 그 파일은 「이용조건」의 집행 목록이고
#     여기는 「어떻게 부르는가」다. 축이 다르면 파일도 다르다 (D-89).
#
#  🚨 값은 **추정하지 않는다.** 비어 있으면 수집기가 거부하고 어디를 봐야 하는지 알려준다.
#     찾는 법: 포털 소개 페이지 → 「상세기능」 → 요청주소(엔드포인트).
#     `python launcher.py probe <소스id>` 가 화면에서 후보를 주워 실측 리포트에 적는다.
#
#  🚨 serviceKey 는 여기 적지 않는다 — .env 의 DATA_GO_KR_KEY 를 코드가 붙인다.
#     키를 이 파일에 적으면 커밋된다 (gitleaks 가 막지만 애초에 넣지 않는다).
#
#  ★ LINK 유형의 실제 호출처를 확인하는 법 (2026-09-02 확인) —
#    data.go.kr 상세 화면의 「바로가기」 버튼이 부르는 것은
#      GET https://www.data.go.kr/tcs/dss/selectApiLinkUrl.do?publicDataPk=<데이터번호>
#    이고 응답 JSON 의 `linkUrl` 이 **원 기관 페이지**다. `linkUrl: null` 이면 LINK 가 아니다.
#    화면을 눈으로 읽는 것보다 이 쪽이 재현 가능하다.
#
#  필드
#    url        요청주소. 쿼리스트링 없이 경로까지만
#    rows_key   응답에서 목록이 들어 있는 키 (JSON 기준). 모르면 비워 둔다
#    total_key  전체 건수 키. 페이징 종료 판단에 쓴다
#    params     serviceKey·pageNo·numOfRows 외에 고정으로 붙일 것
#    fmt        json | xml  — API 마다 다르다
#    style      query | path
#               🚨 포털마다 호출 규약이 다르다 (2026-09-02).
#               query : data.go.kr — ?serviceKey=..&pageNo=..&numOfRows=..
#               path  : 식품안전나라 — /api/{keyId}/{serviceId}/{dataType}/{startIdx}/{endIdx}
#               같은 「오픈API」라는 말이 같은 호출을 뜻하지 않는다.
#
#  🚨 style 은 **두 가지뿐**이고 그것이 곧 키 선택이다 — `openapi.py:107` 이
#     path → FOODSAFETY_KEY, query → DATA_GO_KR_KEY 로 **하드코딩**되어 있다.
#     인증 파라미터 이름이 serviceKey 도 keyId 도 아닌 API 는 이 파일로 표현할 수 없다.
#     (ftc_decisions_api 가 그렇다 — 아래 참조)
# ============================================================

mfds_hf_ingredient:      # 15058359 건기식 기능성 원료인정 현황
  # 🚨 data.go.kr 상세의 **API 유형이 LINK** 다 — 자체 엔드포인트 없이 원 기관으로 연결한다.
  #    그래서 호출처가 식품안전나라이고, 이용조건은 data.go.kr 쪽(제한 없음)이 대표한다.
  #    포털 페이지가 엔드포인트가 아니라는 것이 여기서 **두 겹**이었다.
  # 🔄 2026-09-02 재확인 — selectApiLinkUrl.do(15058359) 의 linkUrl:
  #    …/api/openApiInfo.do?…&svc_no=I-0040&svc_type_cd=API_TYPE06  → LINK 확정, 하이픈 포함 확정
  url: http://openapi.foodsafetykorea.go.kr/api
  style: path            # /{keyId}/{serviceId}/{dataType}/{startIdx}/{endIdx}
  fmt: json
  service_id: I-0040     # 🔄 2026-09-02 확인 — 샘플 URL 이 /api/sample/I-0050/xml/1/5 라 **하이픈 포함**이 맞다
  # ✅ 2026-09-02 첫 수집 성공 — total_count **773**. 🚨 게시판이 말한 650건과 다르다 (미해소).
  #    응답 최상위 키는 **요청한 service_id 그대로** `I-0040` 다 (하이픈 포함).
  #    → 전처리는 최상위 키를 하드코딩하지 않고 이 파일의 service_id 를 쓴다.
  # 🚨 출력 9항목이고 **`PRIMARY_FNCLTY` 는 없다** — 승인 문구 필드는 **`FNCLTY_CN`** 이다.
  #    (PRIMARY_FNCLTY 는 I-0050 쪽 이름이다. 두 서비스의 필드명이 다르다.)
  #    FNCLTY_CN 예: "…높은 혈중 콜레스테롤 수치 개선에 도움을 줄 수 있습니다(기타기능Ⅱ)"
  #    ★ 2층 화이트리스트가 여기서 나온다.
  # 🚨 마스킹 대상이 온다 — BSSH_NM(업소명) · ADDR(주소). D-17 즉시 마스킹.
  params: {}

mfds_hf_individual:      # 15074311 건기식 개별인정형 정보 = 식품안전나라 I-0050
  # 🔄 2026-09-02 — 요청주소·출력항목 확인. 샘플: /api/sample/I-0050/xml/1/5
  #    출력 7항목: HF_FNCLTY_MTRAL_RCOGN_NO(원료인정번호) · DAY_INTK_HIGHLIMIT/LOWLIMIT(1일 섭취량
  #    상·하한) · WT_UNIT(중량단위) · RAWMTRL_NM(원재료명) · IFTKN_ATNT_MATR_CN(섭취시 주의사항) ·
  #    **PRIMARY_FNCLTY(주된 기능성)** ← 2층이 찾던 승인 문구.
  #    ★ 업체명·주소가 **없다** — I-0040 과 달리 마스킹 대상이 아예 안 온다.
  # ✅ 2026-09-02 해소 — **LINK 확정.** selectApiLinkUrl.do(15074311) 의 linkUrl 이
  #    …/api/openApiInfo.do?…&svc_no=I-0050&svc_type_cd=API_TYPE06 로 식품안전나라를 가리킨다.
  #    → data.go.kr 에 별도 엔드포인트가 없다. 2인 확인이 덮는 경로는 **data.go.kr 15074311**
  #      (이용허락범위 제한 없음)이고 호출만 식품안전나라로 간다 — I-0040 과 같은 구조다.
  url: http://openapi.foodsafetykorea.go.kr/api
  style: path
  fmt: json
  service_id: I-0050
  params: {}

